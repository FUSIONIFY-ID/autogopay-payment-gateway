name: Validate AutoGoPay Skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autogopay-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/sync_vscode.py
      - run: python scripts/validate_repo.py
      - run: python scripts/sync_skill.py --check
      - run: python scripts/run_evals.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/node.test.mjs
      - run: node --test vscode-extension/test/*.test.js
      - name: Verify PHP signature helper
        run: php tests/php_test.php
      - run: python scripts/package_skill.py
      - name: Package VS Code extension
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce package --no-dependencies --skip-license --out ../dist/autogopay-payment-gateway-0.3.1.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: autogopay-validated-packages
          path: dist/
          if-no-files-found: error
